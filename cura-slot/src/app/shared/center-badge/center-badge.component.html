@if (tenantService.selectedTenant(); as center) {
  <div class="relative flex justify-center mb-5">
    <button type="button" (click)="toggle()"
            class="inline-flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors text-xs font-medium text-gray-700">
      <span class="w-5 h-5 rounded-full border border-black/10" [style.background-color]="center.primaryColorHex"></span>
      {{ center.name }}
      @if (tenantService.centers().length > 1) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      }
    </button>

    @if (isOpen() && tenantService.centers().length > 1) {
      <div class="absolute top-full mt-2 z-20 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 overflow-hidden">
        <p class="px-4 pt-1 pb-2 text-xs font-medium text-gray-400">{{ 'CENTER_BADGE.CHOOSE' | translate }}</p>
        @for (c of tenantService.centers(); track c.id) {
          <button type="button" (click)="select(c.id)"
                  class="w-full flex items-center gap-2.5 px-4 py-2 text-sm text-left hover:bg-gray-50 transition-colors"
                  [class.font-semibold]="c.id === center.id" [class.text-gray-900]="c.id === center.id"
                  [class.text-gray-600]="c.id !== center.id">
            <span class="w-4 h-4 rounded-full border border-black/10 shrink-0" [style.background-color]="c.primaryColorHex"></span>
            {{ c.name }}
          </button>
        }
      </div>
    }
  </div>
}

<main class="w-full min-h-screen bg-gray-50 pt-8 px-4 sm:px-6 pb-12">
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6 items-start">

    <app-doctor-sidebar />

    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl p-6 sm:p-8">
      <h1 class="text-2xl font-semibold text-gray-900 mb-2">
        {{ 'DOCTOR_PROFILE_SETUP.HEADING' | translate }}
      </h1>
      <p class="text-sm text-gray-600 mb-8">
        {{ 'DOCTOR_PROFILE_SETUP.SUBHEADING' | translate }}
      </p>

      <app-doctor-profile-form
        [initial]="null"
        [isSaving]="isSaving"
        [showCancel]="false"
        submitLabelKey="DOCTOR_PROFILE_SETUP.SUBMIT"
        (formSubmit)="create($event)" />
    </div>
  </div>
</main>

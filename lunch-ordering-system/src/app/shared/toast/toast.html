<div class="fixed top-24 right-6 z-50 flex flex-col gap-3 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-stretch min-w-[300px] max-w-md bg-heading text-cream rounded-2xl shadow-2xl overflow-hidden
             animate-[slideIn_0.25s_ease-out]">

      <div
        class="w-1.5 shrink-0"
        [ngClass]="{
          'bg-brand': toast.type === 'success',
          'bg-red-400': toast.type === 'error',
          'bg-brand-soft': toast.type === 'info'
        }">
      </div>

      <div class="flex items-center gap-3 flex-1 px-5 py-4">

        @switch (toast.type) {
          @case ('success') {
            <svg class="w-5 h-5 shrink-0 text-brand-soft" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
          }
          @case ('error') {
            <svg class="w-5 h-5 shrink-0 text-red-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
            </svg>
          }
          @case ('info') {
            <svg class="w-5 h-5 shrink-0 text-brand-soft" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
        }

        <span class="font-medium text-base flex-1">{{ toast.message }}</span>

        <button
          type="button"
          (click)="toastService.dismiss(toast.id)"
          class="shrink-0 w-6 h-6 flex items-center justify-center rounded-full text-gray-400 hover:text-cream hover:bg-white/10 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  }
</div>
